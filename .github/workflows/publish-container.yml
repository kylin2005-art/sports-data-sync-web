name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v0.3.0)
        required: true
        type: string
      verify_only:
        description: Pull the published image anonymously and run the Compose smoke check
        default: false
        type: boolean

jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      VERIFY_ONLY: ${{ inputs.verify_only }}
      GARMIN_WEB_ORIGIN: http://127.0.0.1:18768
      GARMIN_WEB_PUBLISH_PORT: '18768'
      GARMIN_WEB_AUTH_MODE: personal
    steps:
      - name: Prepare tagged source and image Compose file
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git clone --depth 1 --single-branch --branch "$RELEASE_TAG" \
            "https://github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/source"
          revision=$(git -C "$RUNNER_TEMP/source" rev-parse HEAD)
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG"
          mkdir -p "$RUNNER_TEMP/deployment/.deploy-secrets"
          grep -Fxq '    build: .' "$RUNNER_TEMP/source/compose.yaml"
          sed "s|^    build: \.$|    image: $image|" \
            "$RUNNER_TEMP/source/compose.yaml" > "$RUNNER_TEMP/deployment/compose.yaml"
          node -p "require('node:crypto').randomBytes(32).toString('base64url')" \
            > "$RUNNER_TEMP/deployment/.deploy-secrets/vault-key"
          chmod 0444 "$RUNNER_TEMP/deployment/.deploy-secrets/vault-key"
          printf 'IMAGE=%s\nREVISION=%s\n' "$image" "$revision" >> "$GITHUB_ENV"

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64

      - name: Set up Buildx
        if: ${{ !inputs.verify_only }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build the tagged image for smoke testing
        if: ${{ !inputs.verify_only }}
        run: |
          docker buildx build --platform linux/amd64 --load --tag "$IMAGE" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" "$RUNNER_TEMP/source"

      - name: Check Compose startup and data persistence
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/deployment"
          if [[ "$VERIFY_ONLY" == true ]]; then
            export DOCKER_CONFIG="$(mktemp -d)"
            docker compose pull
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")" = "$REVISION"
          fi
          trap 'docker compose down --volumes' EXIT
          docker compose up -d --no-build --pull never --wait --wait-timeout 90
          curl -fsS "$GARMIN_WEB_ORIGIN/healthz" | jq -e '.ok == true'
          curl -fsS -c session -H "Origin: $GARMIN_WEB_ORIGIN" -H 'Content-Type: application/json' \
            --data '{"username":"smoke-user","password":"compose-smoke-fixture"}' \
            "$GARMIN_WEB_ORIGIN/api/auth/setup" | jq -e '.viewer.username == "smoke-user"'
          curl -fsS -b session "$GARMIN_WEB_ORIGIN/" > workspace.html
          grep -Fq 'id="ride-report-heading"' workspace.html
          grep -Fq 'data-panel="analysis"' workspace.html
          docker compose up -d --no-build --pull never --force-recreate --wait --wait-timeout 90
          curl -fsS -b session "$GARMIN_WEB_ORIGIN/api/ride-report/month?month=2026-11" \
            | jq -e '.current.rideCount == 0'
          if [[ "$VERIFY_ONLY" == true ]]; then
            docker pull --platform linux/arm64 "$IMAGE"
            test "$(docker run --platform linux/arm64 --pull never --rm "$IMAGE" node -p 'process.arch')" = arm64
          fi

      - name: Push the amd64 and arm64 image
        if: ${{ !inputs.verify_only }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 --push --tag "$IMAGE" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" "$RUNNER_TEMP/source"
          docker buildx imagetools inspect "$IMAGE"